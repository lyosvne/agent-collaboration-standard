name: Governance Validate

on:
  push:
    branches:
      - master
      - "migration/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  truth:
    name: governance-truth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate governance truth
        run: python3 scripts/check-governance-truth.py

      - name: Scanner tests
        run: python3 -m unittest scripts/check_governance_truth_test.py

      - name: Validate review JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = list(Path("archive").rglob("*.json"))
          if not files:
              raise SystemExit("no archive JSON files found")
          for path in files:
              json.loads(path.read_text())
          print(f"validated {len(files)} review JSON files")
          PY
