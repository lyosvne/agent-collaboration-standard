name: Publish Governance Sync Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact 40-character commit reachable from master
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: governance-sync-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned canonical repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Select and validate target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_COMMIT: ${{ github.sha }}
          MANUAL_COMMIT: ${{ inputs.target_commit }}
          BASE_COMMIT: bef402ae2c2518961c6abe0d90a1838346e9afb9
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = workflow_dispatch; then
            target=$MANUAL_COMMIT
          else
            target=$PUSH_COMMIT
          fi
          test "$(printf '%s' "$target" | wc -c)" -eq 40
          case "$target" in *[!0-9a-f]*) exit 1 ;; esac
          git cat-file -e "$target^{commit}"
          master=$(git rev-parse refs/remotes/origin/master)
          git merge-base --is-ancestor "$target" "$master"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$BASE_COMMIT" "$target"
          printf 'commit=%s\n' "$target" >>"$GITHUB_OUTPUT"
          printf 'tag=governance-sync-v2-%s\n' "$target" >>"$GITHUB_OUTPUT"

      - name: Build incremental bundle and canonical schema-2 manifest
        env:
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
          BASE_COMMIT: bef402ae2c2518961c6abe0d90a1838346e9afb9
        run: |
          set -euo pipefail
          git update-ref refs/heads/master "$TARGET_COMMIT"
          if test "$TARGET_COMMIT" = "$BASE_COMMIT"; then
            exclude="$TARGET_COMMIT^"
          else
            exclude="$BASE_COMMIT"
          fi
          git bundle create governance.bundle refs/heads/master "^$exclude"
          git bundle verify governance.bundle
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          bundle = Path("governance.bundle")
          payload = {
              "bundle": {
                  "name": "governance.bundle",
                  "sha256": hashlib.sha256(bundle.read_bytes()).hexdigest(),
                  "size": bundle.stat().st_size,
              },
              "base_commit": os.environ["BASE_COMMIT"],
              "bundle_kind": "incremental",
              "commit": os.environ["TARGET_COMMIT"],
              "schema_version": 2,
          }
          Path("governance-sync-manifest.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 scripts/publish-governance-release.py
