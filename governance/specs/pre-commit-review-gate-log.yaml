# Pre-commit 评审闸门日志（唯一事实源）
#
# 字段约定：
#   gate_id      : 闸门对象唯一标识（patch 脚本命名 apply-<gate_id>.py 必须与此精确等值匹配）
#   files        : patch 文件名精确列表（hook 提取 apply-*.py 完整文件名后查 files 字段精确等值）
#   verdict      : PASS / 事后补审 / override / REVIEWING
#   trigger_class: governance-review-process.md §四.步骤0 强制清单编号（1-6，可多选）
#   review_dir   : archive/governance-review-<对象>-<date>/
#   pass_round   : 走到第几轮才三方一致 PASS（round1/round2/round3）
#   commit_sha   : 对应 fix(pi-governance): commit 短 SHA
#   date         : patch 应用日期（YYYY-MM-DD）
#   reviewer     : 评审方组合（A/B/C）
#   expires      : 可选，PASS 有效期截止（ISO 日期），不填则永久
#   override_reason: **verdict=override 时必填**，紧急 hotfix 原因（SO-8: hook 校验非空）
#   override_date  : **verdict=override 时必填**，override 使用日期（YYYY-MM-DD）
#
# Hook 读取：~/.zcode/hooks/review-gate-precommit.py 在 scp/rsync/ssh 到 ECS 且匹配
#   apply-*.py 或 /opt/pi-orchestrator 写路径时：
#   1. 查 files 字段精确等值 + verdict=PASS → 放行
#   2. 无 PASS 条目 → deny
#   3. SO-8 强制校验：若本地有未补录的 override pending（~/.zcode/hooks/.review-gate-override-pending.json），
#      且本表无 verdict=override + override_reason 非空 条目 → deny（防"事后补退化为事后忘"）
#
# 维护方：ZCode（每次 ECS patch PASS 后追加；每次"事后补审/override"也必须留痕）。
#
